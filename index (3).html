<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Iframe Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        margin: 0;
        background: #0f0f0f;
        color: #fff;
        overflow: hidden;
    }

    .topbar {
        display: flex;
        gap: 8px;
        padding: 10px;
        background: #1a1a1a;
        border-bottom: 1px solid #333;
    }

    input {
        flex: 1;
        padding: 8px 10px;
        background: #111;
        color: #fff;
        border: 1px solid #333;
        border-radius: 6px;
        outline: none;
    }

    button {
        padding: 8px 12px;
        background: #3b82f6;
        border: none;
        color: white;
        border-radius: 6px;
        cursor: pointer;
    }

    button:hover {
        background: #2563eb;
    }

    iframe {
        width: 100%;
        height: calc(100vh - 55px);
        border: none;
        background: #000;
    }
</style>
</head>
<body>

<div class="topbar">
    <input id="url" placeholder="Masukin link di sini..." />
    <button onclick="loadIframe()">Open</button>
    <button onclick="refreshIframe()">Refresh</button>
    <button onclick="fullscreen()">Fullscreen</button>
</div>

<iframe id="frame"></iframe>

<script>
function loadIframe() {
    let url = document.getElementById("url").value.trim();
    if (!url) return;

    if (!url.startsWith("http")) {
        url = "https://" + url;
    }

    document.getElementById("frame").src = url;
}

function refreshIframe() {
    const iframe = document.getElementById("frame");
    iframe.src = iframe.src;
}

function fullscreen() {
    const iframe = document.getElementById("frame");
    if (iframe.requestFullscreen) iframe.requestFullscreen();
}
</script>

</body>
</html>
